<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 186" width="880" height="186" role="img" aria-labelledby="title desc">
  <title id="title">03 · Systems in development</title>
  <desc id="desc">Systems in development, built through DevDevise: W-001 Task4Task, a marketplace for paid tasks and barter; W-002 CivicPulse, AI community intelligence; W-003 Agrimonitor, remote-sensing R&amp;D. No user, revenue or accuracy figures are published yet.</desc>
  <style>
    .sans{font-family:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
    .blink{animation:blink 1.1s steps(1,end) infinite}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.in,.blink{animation:none}}
  </style>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0.00" stop-color="#35E3FF"/><stop offset="0.50" stop-color="#4C8DFF"/><stop offset="1.00" stop-color="#9D7BFF"/></linearGradient>
    <radialGradient id="g0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 60) scale(320 160)"><stop offset="0" stop-color="#35E3FF" stop-opacity="0.12"/><stop offset="1" stop-color="#35E3FF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="878" height="184" rx="14" fill="#04060B" stroke="#161D2E" stroke-width="2"/>
  <rect x="2" y="2" width="876" height="182" rx="13" fill="url(#g0)"/>
  <rect x="1" y="1" width="878" height="3" rx="1.5" fill="url(#top)"/>
  <text class="m" x="28" y="34" font-size="12" letter-spacing="2" font-weight="700" fill="#35E3FF">03 · SYSTEMS</text>
  <text class="m" x="852" y="34" font-size="12" letter-spacing="1" fill="#6B7489" text-anchor="end">active · in development</text>
<text class="sans in" x="28" y="80" font-size="26" font-weight="600" fill="#EEF1F8">Systems in development, <tspan fill="#35E3FF">built through DevDevise.</tspan></text><text class="sans" x="28" y="110" font-size="15" fill="#9AA3B8">Real and active. No user, revenue or accuracy figures are published yet, so none are claimed here.</text><rect x="28" y="135" width="11" height="11" fill="#35E3FF"/><text class="m" x="46" y="145" font-size="12" font-weight="700" letter-spacing="1" fill="#35E3FF">W-001</text><text class="sans" x="98" y="145" font-size="14" font-weight="600" fill="#EEF1F8">Task4Task</text><text class="m" x="46" y="164" font-size="10.5" fill="#6B7489">paid tasks + barter</text><rect x="308" y="135" width="11" height="11" fill="#35E3FF"/><text class="m" x="326" y="145" font-size="12" font-weight="700" letter-spacing="1" fill="#35E3FF">W-002</text><text class="sans" x="378" y="145" font-size="14" font-weight="600" fill="#EEF1F8">CivicPulse</text><text class="m" x="326" y="164" font-size="10.5" fill="#6B7489">community intelligence</text><rect x="588.5" y="135.5" width="10" height="10" fill="none" stroke="#9D7BFF"/><rect x="588.5" y="135.5" width="5.0" height="10" fill="#9D7BFF"/><text class="m" x="606" y="145" font-size="12" font-weight="700" letter-spacing="1" fill="#9D7BFF">W-003</text><text class="sans" x="658" y="145" font-size="14" font-weight="600" fill="#EEF1F8">Agrimonitor</text><text class="m" x="606" y="164" font-size="10.5" fill="#6B7489">remote-sensing R&amp;D</text>
</svg>
