<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 762" width="880" height="762" role="img" aria-labelledby="title desc">
  <title id="title">04 · Shipped — four case files</title>
  <desc id="desc">SHIP-01 ChattersHub CRM: problem, Lead handling depended on manual effort. System, A CRM built around automating the lead pipeline. Stack: Next.js · React · Tailwind · Node.js · TypeScript · Express · MongoDB · AWS S3 · Docker. Outcome: 60% less manual lead-handling time.  SHIP-02 Syndication + OMS · Comtanix: problem, Posting to every channel by hand; slow order handling. System, A social-media syndication tool, and an order management system. Stack: syndication · order management · e-commerce. Outcome: 90% of posting workflows automated. +30% engagement · +60% team productivity (OMS) SHIP-03 Pindot Calendar Sync: problem, Google and CalDAV calendars drift apart. System, Sync between Google Calendar and a CalDAV server (Baïkal). Stack: Laravel · MySQL · Google Calendar API · CalDAV. Aim, not measured: One calendar, whichever client edits it. SHIP-04 Lease Match NYC: problem, Matching renters to apartments by hand. System, An AI-powered apartment matchmaking platform. Stack: Express · React · Tailwind · MongoDB · OpenAI · geolocation. Aim, not measured: Match renters to apartments by fit and place.</desc>
  <style>
    .sans{font-family:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
    .blink{animation:blink 1.1s steps(1,end) infinite}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.in,.blink{animation:none}}
  </style>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0.00" stop-color="#4C8DFF"/><stop offset="1.00" stop-color="#35E3FF"/></linearGradient>
    <radialGradient id="g0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 120) scale(300 200)"><stop offset="0" stop-color="#4C8DFF" stop-opacity="0.1"/><stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/></radialGradient><radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 560) scale(320 220)"><stop offset="0" stop-color="#35E3FF" stop-opacity="0.1"/><stop offset="1" stop-color="#35E3FF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="878" height="760" rx="14" fill="#04060B" stroke="#161D2E" stroke-width="2"/>
  <rect x="2" y="2" width="876" height="758" rx="13" fill="url(#g0)"/><rect x="2" y="2" width="876" height="758" rx="13" fill="url(#g1)"/>
  <rect x="1" y="1" width="878" height="3" rx="1.5" fill="url(#top)"/>
  <text class="m" x="28" y="34" font-size="12" letter-spacing="2" font-weight="700" fill="#35E3FF">04 · SHIPPED</text>
  <text class="m" x="852" y="34" font-size="12" letter-spacing="1" fill="#6B7489" text-anchor="end">problem → system → stack → outcome</text>
<text class="sans" x="28" y="76" font-size="15" fill="#9AA3B8">Delivered as an engineer, before and alongside DevDevise. Read each card <tspan fill="#EEF1F8">problem → system → stack → </tspan><tspan fill="#35E3FF">outcome</tspan>.</text><g class="in" style="animation-delay:0.00s"><rect x="28" y="100" width="404" height="300" rx="10" fill="#0B1120" stroke="#35E3FF" stroke-opacity=".35"/><rect x="28" y="114" width="3" height="34" fill="#35E3FF"/><rect x="46" y="120" width="9" height="9" fill="#35E3FF"/><text class="m" x="62" y="129" font-size="11" font-weight="700" letter-spacing="1.5" fill="#35E3FF">SHIP-01</text><text class="sans" x="46" y="150" font-size="18" font-weight="600" fill="#EEF1F8">ChattersHub CRM</text><text class="m" x="46" y="180" font-size="10" letter-spacing="2" fill="#6B7489">PROBLEM</text><text class="sans" x="124" y="180" font-size="13.5" fill="#9AA3B8">Lead handling depended on manual effort.</text><text class="m" x="46" y="214" font-size="10" letter-spacing="2" fill="#6B7489">SYSTEM</text><text class="sans" x="124" y="214" font-size="13.5" fill="#9AA3B8">A CRM built around automating the lead</text><text class="sans" x="124" y="232" font-size="13.5" fill="#9AA3B8">pipeline.</text><text class="m" x="46" y="266" font-size="10" letter-spacing="2" fill="#6B7489">STACK</text><text class="m" x="124" y="266" font-size="11" fill="#4C8DFF">Next.js · React · Tailwind · Node.js</text><text class="m" x="124" y="283" font-size="11" fill="#4C8DFF">TypeScript · Express · MongoDB · AWS S3 · Docker</text><line x1="46" y1="330" x2="414" y2="330" stroke="#161D2E"/><text class="m" x="46" y="348" font-size="10" letter-spacing="2" fill="#35E3FF">OUTCOME</text><text class="sans" x="44" y="382" font-size="34" font-weight="700" fill="#35E3FF">60%</text><text class="sans" x="117" y="378" font-size="13.5" fill="#EEF1F8">less manual lead-handling time</text></g>
<g class="in" style="animation-delay:0.15s"><rect x="448" y="100" width="404" height="300" rx="10" fill="#0B1120" stroke="#35E3FF" stroke-opacity=".35"/><rect x="448" y="114" width="3" height="34" fill="#35E3FF"/><rect x="466" y="120" width="9" height="9" fill="#35E3FF"/><text class="m" x="482" y="129" font-size="11" font-weight="700" letter-spacing="1.5" fill="#35E3FF">SHIP-02</text><text class="sans" x="466" y="150" font-size="18" font-weight="600" fill="#EEF1F8">Syndication + OMS · Comtanix</text><text class="m" x="466" y="180" font-size="10" letter-spacing="2" fill="#6B7489">PROBLEM</text><text class="sans" x="544" y="180" font-size="13.5" fill="#9AA3B8">Posting to every channel by hand; slow</text><text class="sans" x="544" y="198" font-size="13.5" fill="#9AA3B8">order handling.</text><text class="m" x="466" y="232" font-size="10" letter-spacing="2" fill="#6B7489">SYSTEM</text><text class="sans" x="544" y="232" font-size="13.5" fill="#9AA3B8">A social-media syndication tool, and an</text><text class="sans" x="544" y="250" font-size="13.5" fill="#9AA3B8">order management system.</text><text class="m" x="466" y="284" font-size="10" letter-spacing="2" fill="#6B7489">STACK</text><text class="m" x="544" y="284" font-size="11" fill="#4C8DFF">syndication · order management · e-commerce</text><line x1="466" y1="330" x2="834" y2="330" stroke="#161D2E"/><text class="m" x="466" y="348" font-size="10" letter-spacing="2" fill="#35E3FF">OUTCOME</text><text class="sans" x="464" y="382" font-size="34" font-weight="700" fill="#35E3FF">90%</text><text class="sans" x="537" y="368" font-size="13.5" fill="#EEF1F8">of posting workflows automated</text><text class="sans" x="537" y="386" font-size="12" fill="#9AA3B8">+30% engagement · +60% team productivity (OMS)</text></g>
<g class="in" style="animation-delay:0.30s"><rect x="28" y="416" width="404" height="300" rx="10" fill="#0B1120" stroke="#9D7BFF" stroke-opacity=".35"/><rect x="28" y="430" width="3" height="34" fill="#9D7BFF"/><rect x="46" y="436" width="9" height="9" fill="#9D7BFF"/><text class="m" x="62" y="445" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9D7BFF">SHIP-03</text><text class="sans" x="46" y="466" font-size="18" font-weight="600" fill="#EEF1F8">Pindot Calendar Sync</text><text class="m" x="46" y="496" font-size="10" letter-spacing="2" fill="#6B7489">PROBLEM</text><text class="sans" x="124" y="496" font-size="13.5" fill="#9AA3B8">Google and CalDAV calendars drift apart.</text><text class="m" x="46" y="530" font-size="10" letter-spacing="2" fill="#6B7489">SYSTEM</text><text class="sans" x="124" y="530" font-size="13.5" fill="#9AA3B8">Sync between Google Calendar and a CalDAV</text><text class="sans" x="124" y="548" font-size="13.5" fill="#9AA3B8">server (Baïkal).</text><text class="m" x="46" y="582" font-size="10" letter-spacing="2" fill="#6B7489">STACK</text><text class="m" x="124" y="582" font-size="11" fill="#4C8DFF">Laravel · MySQL · Google Calendar API · CalDAV</text><line x1="46" y1="646" x2="414" y2="646" stroke="#161D2E"/><text class="m" x="46" y="664" font-size="10" letter-spacing="2" fill="#9D7BFF">AIM · NOT MEASURED</text><text class="sans" x="46" y="694" font-size="16" font-style="italic" fill="#C4B2FF">One calendar, whichever client edits it.</text></g>
<g class="in" style="animation-delay:0.45s"><rect x="448" y="416" width="404" height="300" rx="10" fill="#0B1120" stroke="#9D7BFF" stroke-opacity=".35"/><rect x="448" y="430" width="3" height="34" fill="#9D7BFF"/><rect x="466" y="436" width="9" height="9" fill="#9D7BFF"/><text class="m" x="482" y="445" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9D7BFF">SHIP-04</text><text class="sans" x="466" y="466" font-size="18" font-weight="600" fill="#EEF1F8">Lease Match NYC</text><text class="m" x="466" y="496" font-size="10" letter-spacing="2" fill="#6B7489">PROBLEM</text><text class="sans" x="544" y="496" font-size="13.5" fill="#9AA3B8">Matching renters to apartments by hand.</text><text class="m" x="466" y="530" font-size="10" letter-spacing="2" fill="#6B7489">SYSTEM</text><text class="sans" x="544" y="530" font-size="13.5" fill="#9AA3B8">An AI-powered apartment matchmaking</text><text class="sans" x="544" y="548" font-size="13.5" fill="#9AA3B8">platform.</text><text class="m" x="466" y="582" font-size="10" letter-spacing="2" fill="#6B7489">STACK</text><text class="m" x="544" y="582" font-size="11" fill="#4C8DFF">Express · React · Tailwind · MongoDB</text><text class="m" x="544" y="599" font-size="11" fill="#4C8DFF">OpenAI · geolocation</text><line x1="466" y1="646" x2="834" y2="646" stroke="#161D2E"/><text class="m" x="466" y="664" font-size="10" letter-spacing="2" fill="#9D7BFF">AIM · NOT MEASURED</text><text class="sans" x="466" y="694" font-size="16" font-style="italic" fill="#C4B2FF">Match renters to apartments by fit and place.</text></g>
<text class="m" x="28" y="744" font-size="11" letter-spacing=".5" fill="#6B7489">Where a result was measured it is <tspan fill="#35E3FF">cyan</tspan>; where it wasn’t, the card says aim, in <tspan fill="#9D7BFF">violet</tspan>: unproven.</text>
</svg>
