<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-labelledby="title desc">
  <title id="title">Notation — and the end of the current entries</title>
  <desc id="desc">How to read this profile. A solid square marks real, built work; a half-filled square marks experimental R&amp;D; a dashed square marks something proposed or illustrative. Solid lines are built, dashed lines are proposed. Cyan is systems and data in motion, violet is research and the unresolved, blue is links, amber is signal. End of current entries; the notebook stays open.</desc>
  <style>
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .k{fill:#9AA3B8;font-size:12px}
    .cur{animation:blink 1.1s steps(1,end) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cur{animation:none}}
  </style>
  <rect x="1" y="1" width="878" height="148" rx="14" fill="#04060B" stroke="#161D2E" stroke-width="2"/>
  <text class="m" x="28" y="34" font-size="11" letter-spacing="2" fill="#6B7489">NOTATION</text>

  <g class="m">
    <rect x="28" y="54" width="11" height="11" fill="#EEF1F8"/>
    <text class="k" x="48" y="64">built / real</text>
    <rect x="168.5" y="54.5" width="10" height="10" fill="none" stroke="#EEF1F8"/><rect x="168.5" y="54.5" width="5" height="10" fill="#EEF1F8"/>
    <text class="k" x="188" y="64">experimental</text>
    <rect x="308.5" y="54.5" width="10" height="10" fill="none" stroke="#EEF1F8" stroke-dasharray="2.5 2"/>
    <text class="k" x="328" y="64">proposed / illustrative</text>

    <line x1="530" y1="60" x2="560" y2="60" stroke="#35E3FF" stroke-width="1.5"/>
    <text class="k" x="568" y="64">built</text>
    <line x1="630" y1="60" x2="660" y2="60" stroke="#9D7BFF" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="k" x="668" y="64">proposed</text>

    <circle cx="33" cy="94" r="4.5" fill="#35E3FF"/><text class="k" x="48" y="98">systems, data in motion</text>
    <circle cx="260" cy="94" r="4.5" fill="#9D7BFF"/><text class="k" x="274" y="98">research, the unresolved</text>
    <circle cx="496" cy="94" r="4.5" fill="#4C8DFF"/><text class="k" x="510" y="98">links</text>
    <circle cx="580" cy="94" r="4.5" fill="#FFB547"/><text class="k" x="594" y="98">signal, used sparingly</text>
  </g>

  <line x1="28" y1="118" x2="852" y2="118" stroke="#161D2E" stroke-width="1.5"/>
  <text class="m" x="28" y="138" font-size="11" letter-spacing="1" fill="#6B7489">end of current entries · the notebook stays open <tspan class="cur" fill="#35E3FF">▍</tspan></text>
  <text class="m" x="852" y="138" font-size="11" letter-spacing="1" fill="#6B7489" text-anchor="end">palette · DevDevise</text>
</svg>
