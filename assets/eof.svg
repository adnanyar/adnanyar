<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 80" width="880" height="80" role="img" aria-labelledby="title">
  <title id="title">End of current entries — the notebook stays open</title>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .cur{animation:blink 1.1s steps(1,end) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cur{animation:none}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#00D1FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00D1FF" stop-opacity=".8"/>
      <stop offset=".75" stop-color="#A97CF8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#A97CF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="120" y="20" width="640" height="1.5" fill="url(#g)"/>
  <text class="m" x="440" y="56" font-size="14" fill="#6E7681" text-anchor="middle" letter-spacing="1">end of current entries · the notebook stays open <tspan class="cur" fill="#00D1FF">▍</tspan></text>
</svg>
