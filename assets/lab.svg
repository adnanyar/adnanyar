<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 592" width="880" height="592" role="img" aria-labelledby="title desc">
  <title id="title">06 · Lab — questions and prototypes</title>
  <desc id="desc">Open questions. R-001: Can a website demonstrate engineering reasoning instead of describing it? (tested · findings recorded). EX-01: Can a retrieval system reliably tell when it doesn’t have the answer? (not run). EX-02: How long can a tool-using agent work before its errors compound? (not run). EX-03: Can we tell a model’s input has drifted before its accuracy drops? (not run). On the bench: MedQuery: Multi-tenant medical RAG API: ingestion, chunking, embeddings, retrieval and chat per workspace. FastAPI · Postgres + pgvector. Medical RAG assistant: Documents, images and speech feeding one retrieval pipeline. Python · vector store · LLM. Audio Intelligence Parser: Local speech-to-text, then strict structured extraction. FastAPI · Whisper · OpenAI.</desc>
  <style>
    .sans{font-family:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
    .blink{animation:blink 1.1s steps(1,end) infinite}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.in,.blink{animation:none}}
  </style>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0.00" stop-color="#9D7BFF"/><stop offset="1.00" stop-color="#4C8DFF"/></linearGradient>
    <radialGradient id="g0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 120) scale(340 220)"><stop offset="0" stop-color="#9D7BFF" stop-opacity="0.16"/><stop offset="1" stop-color="#9D7BFF" stop-opacity="0"/></radialGradient><radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 532) scale(300 160)"><stop offset="0" stop-color="#4C8DFF" stop-opacity="0.08"/><stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/></radialGradient>
  </defs>
