  <rect x="2" y="2" width="876" height="588" rx="13" fill="url(#g0)"/><rect x="2" y="2" width="876" height="588" rx="13" fill="url(#g1)"/>
  <rect x="1" y="1" width="878" height="3" rx="1.5" fill="url(#top)"/>
  <text class="m" x="28" y="34" font-size="12" letter-spacing="2" font-weight="700" fill="#9D7BFF">06 · LAB</text>
  <text class="m" x="852" y="34" font-size="12" letter-spacing="1" fill="#6B7489" text-anchor="end">research notebook</text>
<text class="sans" x="28" y="76" font-size="15" fill="#9AA3B8">Questions get the same treatment as systems: <tspan fill="#C4B2FF">stated before they’re tested</tspan>, and labelled honestly.</text><g class="in" style="animation-delay:0.00s"><rect x="28.5" y="108.5" width="11" height="11" fill="none" stroke="#4C8DFF"/><rect x="28.5" y="108.5" width="5.5" height="11" fill="#4C8DFF"/><circle cx="34" cy="114" r="6" fill="none" stroke="#4C8DFF"><animate attributeName="r" values="6;16" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle><text class="m" x="50" y="119" font-size="12" font-weight="700" letter-spacing="1" fill="#4C8DFF">R-001</text><text class="sans" x="112" y="119" font-size="16.5" font-weight="600" fill="#EEF1F8">Can a website demonstrate engineering reasoning instead of describing it?</text><rect x="112" y="130" width="174" height="20" rx="10" fill="#4C8DFF" fill-opacity=".1" stroke="#4C8DFF" stroke-opacity=".6"/><text class="m" x="121" y="144" font-size="10" letter-spacing="1" fill="#4C8DFF">TESTED · FINDINGS RECORDED</text><text class="sans" x="112" y="170" font-size="13" fill="#9AA3B8">The DevDevise site is the experiment: accessibility audits, responsive checks and sequence timing, run on</text><text class="sans" x="112" y="188" font-size="13" fill="#9AA3B8">its own build.</text></g><line x1="28" y1="202" x2="852" y2="202" stroke="#161D2E"/><g class="in" style="animation-delay:0.12s"><rect x="28.5" y="220.5" width="11" height="11" fill="none" stroke="#9D7BFF" stroke-dasharray="2.5 2"/><text class="m" x="50" y="231" font-size="12" font-weight="700" letter-spacing="1" fill="#9D7BFF">EX-01</text><text class="sans" x="112" y="231" font-size="16.5" font-weight="500" fill="#EEF1F8">Can a retrieval system reliably tell when it doesn’t have the answer?</text><rect x="112" y="242" width="60" height="20" rx="10" fill="#9D7BFF" fill-opacity=".1" stroke="#9D7BFF" stroke-opacity=".6"/><text class="m" x="121" y="256" font-size="10" letter-spacing="1" fill="#9D7BFF">NOT RUN</text></g><g class="in" style="animation-delay:0.24s"><rect x="28.5" y="284.5" width="11" height="11" fill="none" stroke="#9D7BFF" stroke-dasharray="2.5 2"/><text class="m" x="50" y="295" font-size="12" font-weight="700" letter-spacing="1" fill="#9D7BFF">EX-02</text><text class="sans" x="112" y="295" font-size="16.5" font-weight="500" fill="#EEF1F8">How long can a tool-using agent work before its errors compound?</text><rect x="112" y="306" width="60" height="20" rx="10" fill="#9D7BFF" fill-opacity=".1" stroke="#9D7BFF" stroke-opacity=".6"/><text class="m" x="121" y="320" font-size="10" letter-spacing="1" fill="#9D7BFF">NOT RUN</text></g><g class="in" style="animation-delay:0.36s"><rect x="28.5" y="348.5" width="11" height="11" fill="none" stroke="#9D7BFF" stroke-dasharray="2.5 2"/><text class="m" x="50" y="359" font-size="12" font-weight="700" letter-spacing="1" fill="#9D7BFF">EX-03</text><text class="sans" x="112" y="359" font-size="16.5" font-weight="500" fill="#EEF1F8">Can we tell a model’s input has drifted before its accuracy drops?</text><rect x="112" y="370" width="60" height="20" rx="10" fill="#9D7BFF" fill-opacity=".1" stroke="#9D7BFF" stroke-opacity=".6"/><text class="m" x="121" y="384" font-size="10" letter-spacing="1" fill="#9D7BFF">NOT RUN</text></g><rect x="28.5" y="406.5" width="11" height="11" fill="none" stroke="#9D7BFF"/><rect x="28.5" y="406.5" width="5.5" height="11" fill="#9D7BFF"/><text class="m" x="48" y="416" font-size="11" font-weight="700" letter-spacing="2" fill="#9D7BFF">ON THE BENCH</text><text class="m" x="852" y="416" font-size="10.5" fill="#6B7489" text-anchor="end">prototypes, built to learn</text><rect x="28" y="432" width="265" height="132" rx="10" fill="#0B1120" stroke="#9D7BFF" stroke-opacity=".35" stroke-dasharray="5 4"/><text class="sans" x="44" y="462" font-size="15" font-weight="600" fill="#EEF1F8">MedQuery</text><text class="sans" x="44" y="486" font-size="12.5" fill="#9AA3B8">Multi-tenant medical RAG API:</text><text class="sans" x="44" y="503" font-size="12.5" fill="#9AA3B8">ingestion, chunking, embeddings,</text><text class="sans" x="44" y="520" font-size="12.5" fill="#9AA3B8">retrieval and chat per workspace.</text><text class="m" x="44" y="550" font-size="10.5" fill="#C4B2FF">FastAPI · Postgres + pgvector</text><rect x="307" y="432" width="265" height="132" rx="10" fill="#0B1120" stroke="#9D7BFF" stroke-opacity=".35" stroke-dasharray="5 4"/><text class="sans" x="323" y="462" font-size="15" font-weight="600" fill="#EEF1F8">Medical RAG assistant</text><text class="sans" x="323" y="486" font-size="12.5" fill="#9AA3B8">Documents, images and speech</text><text class="sans" x="323" y="503" font-size="12.5" fill="#9AA3B8">feeding one retrieval pipeline.</text><text class="m" x="323" y="550" font-size="10.5" fill="#C4B2FF">Python · vector store · LLM</text><rect x="587" y="432" width="265" height="132" rx="10" fill="#0B1120" stroke="#9D7BFF" stroke-opacity=".35" stroke-dasharray="5 4"/><text class="sans" x="603" y="462" font-size="15" font-weight="600" fill="#EEF1F8">Audio Intelligence Parser</text><text class="sans" x="603" y="486" font-size="12.5" fill="#9AA3B8">Local speech-to-text, then strict</text><text class="sans" x="603" y="503" font-size="12.5" fill="#9AA3B8">structured extraction.</text><text class="m" x="603" y="550" font-size="10.5" fill="#C4B2FF">FastAPI · Whisper · OpenAI</text>
