<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="title desc">
  <title id="title">W-002 CivicPulse — relevance by place</title>
  <desc id="desc">A place that matters to someone, with a radius around it. Alerts and news appear across the area; what falls inside the radius comes forward and the rest recedes. Alerts can be created from voice notes, transcribed to English, and the community responds in real time. Status: active, in product development.</desc>
  <style>
    .sans{font-family:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .st{fill:#EEF1F8;font-size:14px;font-weight:600}
    .sub{fill:#6B7489;font-size:11px}
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#94AAFF" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="map"><rect x="28" y="84" width="400" height="190" rx="8"/></clipPath>
  </defs>
  <rect x="1" y="1" width="878" height="318" rx="14" fill="#04060B" stroke="#161D2E" stroke-width="2"/>

  <g class="m" font-size="12" letter-spacing="1.5">
    <rect x="28" y="20" width="10" height="10" fill="#35E3FF"/>
    <text x="46" y="30" fill="#35E3FF" font-weight="700">W-002</text>
    <text x="100" y="30" fill="#EEF1F8">CIVICPULSE</text>
    <text x="852" y="30" fill="#6B7489" text-anchor="end">ACTIVE · PRODUCT DEVELOPMENT</text>
  </g>
  <text class="sans" x="28" y="64" font-size="17" fill="#9AA3B8">Local information, alerts and community, organised by place.</text>

  <!-- the map -->
  <rect x="28" y="84" width="400" height="190" rx="8" fill="url(#grid)" stroke="#161D2E"/>
  <g clip-path="url(#map)">
    <path d="M28 200C110 180 160 230 250 205S380 150 428 170" fill="none" stroke="#1C2540" stroke-width="6"/>
    <path d="M150 84C160 140 140 200 170 274" fill="none" stroke="#1C2540" stroke-width="4"/>
    <!-- radius around a saved place -->
    <circle cx="228" cy="178" r="70" fill="#35E3FF" fill-opacity=".05" stroke="#35E3FF" stroke-opacity=".5" stroke-dasharray="3 4"/>
    <circle cx="228" cy="178" r="8" fill="none" stroke="#35E3FF" stroke-width="1.5">
      <animate attributeName="r" values="8;70" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M228 166l7 12h-14z" fill="#35E3FF"/>
    <!-- signals outside the radius recede -->
    <g fill="#6B7489" opacity=".55">
      <circle cx="70" cy="110" r="4"/><circle cx="380" cy="110" r="4"/><circle cx="400" cy="246" r="4"/>
      <circle cx="64" cy="250" r="4"/><circle cx="330" cy="262" r="4"/><circle cx="110" cy="160" r="4"/>
    </g>
    <!-- signals inside come forward -->
    <g fill="#35E3FF">
      <circle cx="200" cy="150" r="5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="262" cy="200" r="5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="248" cy="132" r="5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="214" r="5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="6s" begin="4.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text class="m" x="40" y="104" font-size="10" letter-spacing="1" fill="#6B7489">SAVED PLACE · RADIUS</text>

  <!-- the flow -->
  <g class="sans">
    <text class="m" x="470" y="104" font-size="11" fill="#35E3FF">01</text><text class="st" x="500" y="104">Place</text>
    <text class="m sub" x="580" y="104">saved, frequent, protected</text>
    <text class="m" x="470" y="140" font-size="11" fill="#35E3FF">02</text><text class="st" x="500" y="140">Signals</text>
    <text class="m sub" x="580" y="140">alerts and news, across the area</text>
    <text class="m" x="470" y="176" font-size="11" fill="#35E3FF">03</text><text class="st" x="500" y="176">Relevance</text>
    <text class="m sub" x="588" y="176">inside comes forward</text>
    <text class="m" x="470" y="212" font-size="11" fill="#9D7BFF">04</text><text class="st" x="500" y="212">Voice alert</text>
    <text class="m sub" x="600" y="212">voice note → English</text>
    <text class="m" x="470" y="248" font-size="11" fill="#35E3FF">05</text><text class="st" x="500" y="248">Response</text>
    <text class="m sub" x="584" y="248">react, comment, live</text>
  </g>
  <!-- a moving cursor over the steps -->
  <rect x="456" y="88" width="3" height="22" fill="#35E3FF">
    <animate attributeName="y" values="88;88;124;124;160;160;196;196;232;232;88" keyTimes="0;.18;.2;.38;.4;.58;.6;.78;.8;.98;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <!-- voice wave beside step 04 -->
  <g stroke="#9D7BFF" stroke-width="2" stroke-linecap="round">
    <line x1="790" y1="207" x2="790" y2="211"><animate attributeName="y1" values="207;200;207" dur="1s" repeatCount="indefinite"/><animate attributeName="y2" values="211;218;211" dur="1s" repeatCount="indefinite"/></line>
    <line x1="798" y1="203" x2="798" y2="215"><animate attributeName="y1" values="203;207;203" dur=".8s" repeatCount="indefinite"/><animate attributeName="y2" values="215;211;215" dur=".8s" repeatCount="indefinite"/></line>
    <line x1="806" y1="205" x2="806" y2="213"><animate attributeName="y1" values="205;199;205" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="213;219;213" dur="1.2s" repeatCount="indefinite"/></line>
  </g>

  <line x1="1" y1="290" x2="879" y2="290" stroke="#161D2E" stroke-width="1.5"/>
  <text class="m" x="28" y="310" font-size="11" letter-spacing=".5" fill="#6B7489">Expo / React Native · Next.js admin · Firebase Realtime Database · voice transcription</text>
</svg>
