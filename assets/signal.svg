<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="title desc">
  <title id="title">01 · Signal — who Adnan Yar is</title>
  <desc id="desc">I'm a software engineer and founder. I founded DevDevise on one idea: strong systems should be devised through investigation and evidence before they are engineered. Role: founder and CEO, DevDevise and SysMalla. Practice: software engineer, systems architect. Focus: intelligent systems, AI and LLM, automation. Record: gold medal, BS Software Engineering.</desc>
  <style>
    .sans{font-family:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
    .blink{animation:blink 1.1s steps(1,end) infinite}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.in,.blink{animation:none}}
  </style>
