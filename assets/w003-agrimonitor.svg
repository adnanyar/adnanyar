<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title desc">
  <title id="title">W-003 Agrimonitor — R&amp;D concept, drawn dashed</title>
  <desc id="desc">A research concept, not a built system. Fields are observed repeatedly by satellite; candidate signals (soil moisture, plant stress, surface temperature, crop growth) are processed and analysed for change: where a condition first appears, the area it affects, and how it expands. The goal is actionable understanding. No results yet.</desc>
  <style>
    .sans{font-family:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .box{fill:none;stroke:#9D7BFF;stroke-opacity:.75;stroke-width:1.3;stroke-dasharray:5 4}
    .st{fill:#EEF1F8;font-size:13px;font-weight:600}
    .sub{fill:#6B7489;font-size:10.5px}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5B4A99"/>
    </marker>
    <clipPath id="field"><rect x="28" y="84" width="250" height="168" rx="8"/></clipPath>
  </defs>
  <rect x="1" y="1" width="878" height="298" rx="14" fill="#04060B" stroke="#161D2E" stroke-width="2"/>

  <g class="m" font-size="12" letter-spacing="1.5">
    <rect x="28.5" y="20.5" width="9" height="9" fill="none" stroke="#9D7BFF"/>
    <rect x="28.5" y="20.5" width="4.5" height="9" fill="#9D7BFF"/>
    <text x="46" y="30" fill="#9D7BFF" font-weight="700">W-003</text>
    <text x="100" y="30" fill="#EEF1F8">AGRIMONITOR</text>
    <text x="852" y="30" fill="#6B7489" text-anchor="end">R&amp;D · EXPERIMENTAL · NO RESULTS YET</text>
  </g>
  <text class="sans" x="28" y="64" font-size="17" fill="#9AA3B8">Can field conditions be inferred from remote sensing, before they show on the ground?</text>

  <!-- the field, seen from above -->
  <rect x="28" y="84" width="250" height="168" rx="8" fill="#060A12" stroke="#161D2E"/>
  <g clip-path="url(#field)">
    <g stroke="none">
      <rect x="28" y="84" width="62" height="72" fill="#0A1420"/>
      <rect x="90" y="84" width="130" height="72" fill="#0C1324"/>
      <rect x="220" y="84" width="58" height="108" fill="#0A1622"/>
      <rect x="28" y="156" width="132" height="96" fill="#0B1220"/>
      <rect x="160" y="156" width="60" height="96" fill="#0D1526"/>
      <rect x="220" y="192" width="58" height="60" fill="#0B1322"/>
    </g>
    <g stroke="#94AAFF" stroke-opacity=".07" stroke-width="1">
      <path d="M36 92L84 140M48 92L84 128M36 104L72 140M100 92L210 148M120 92L210 132M100 108L180 148M168 164L212 244M180 164L212 224M168 184L200 244M36 164L150 244M60 164L150 228M36 184L120 244"/>
    </g>
    <g stroke="#1C2540" stroke-width="1.5">
      <path d="M28 156H278M220 192H278M90 84V156M160 156V252M220 84V252"/>
    </g>
    <!-- a condition, first detected, then expanding -->
    <circle cx="160" cy="168" r="6" fill="#9D7BFF" fill-opacity=".12" stroke="#9D7BFF" stroke-dasharray="3 3">
      <animate attributeName="r" values="6;52;52" keyTimes="0;.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.9;0" keyTimes="0;.8;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="168" r="3" fill="#9D7BFF"/>
    <!-- the satellite pass -->
    <rect x="28" y="84" width="3" height="168" fill="#9D7BFF" opacity=".5">
      <animate attributeName="x" values="28;276" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text class="m" x="40" y="104" font-size="10" letter-spacing="1" fill="#6B7489">FIELD · REPEATED PASSES</text>

  <!-- the chain, all dashed: none of it is presented as built -->
  <g class="sans">
    <rect class="box" x="310" y="128" width="120" height="64" rx="6"/>
    <text class="st" x="324" y="156">Sensing</text><text class="m sub" x="324" y="176">satellite imagery</text>
    <rect class="box" x="460" y="128" width="120" height="64" rx="6"/>
    <text class="st" x="474" y="156">Processing</text><text class="m sub" x="474" y="176">moisture · stress</text>
    <rect class="box" x="610" y="128" width="120" height="64" rx="6"/>
    <text class="st" x="624" y="156">Analysis</text><text class="m sub" x="624" y="176">change detection</text>
    <rect class="box" x="760" y="128" width="96" height="64" rx="6"/>
    <text class="st" x="772" y="156">Insight</text><text class="m sub" x="772" y="176">the goal</text>
  </g>
  <g fill="none" stroke="#5B4A99" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ah)">
    <path d="M278 160H308"/><path d="M430 160H458"/><path d="M580 160H608"/><path d="M730 160H758"/>
  </g>
  <text class="m" x="310" y="226" font-size="11" fill="#6B7489">signals under study: soil moisture · plant water &amp; stress</text>
  <text class="m" x="310" y="244" font-size="11" fill="#6B7489">surface temperature · crop growth · first detection · spread</text>

  <line x1="1" y1="270" x2="879" y2="270" stroke="#161D2E" stroke-width="1.5"/>
  <text class="m" x="28" y="290" font-size="11" letter-spacing=".5" fill="#6B7489">Drawn dashed on purpose: a concept and an exploration, not a production system.</text>
</svg>
