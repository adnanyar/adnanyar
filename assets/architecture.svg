<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 612" width="880" height="612" role="img" aria-labelledby="title desc">
  <title id="title">05 · Architecture — the stack as layers</title>
  <desc id="desc">Interface: React, Next.js, Vue, Tailwind CSS, Expo / React Native. Connected over REST, WebSockets and WebRTC to the application layer: Node.js, TypeScript, Express, Laravel, PHP, Python, FastAPI, RabbitMQ, outbox events, microservices. Below it, data (PostgreSQL, MySQL, MongoDB, Redis, Firebase Realtime Database) and intelligence (OpenAI, LLM flows, RAG, pgvector, Whisper), linked by retrieval. Everything runs on AWS, Docker, CI/CD, Caddy and Git.</desc>
  <style>
    .sans{font-family:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
    .blink{animation:blink 1.1s steps(1,end) infinite}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.in,.blink{animation:none}}
  </style>
