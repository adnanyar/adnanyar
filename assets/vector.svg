  <title id="title">07 · Vector — where this is heading</title>
  <desc id="desc">A trajectory: engineer, architect, researcher, builder, founder. You are here: founder. Now: building: Task4Task, CivicPulse · through DevDevise; researching: Agrimonitor: field conditions from orbit; learning: Remote sensing: moisture, stress, change; asking: When should a retrieval system say “I don’t know”?; direction: From client systems to systems of our own.</desc>
