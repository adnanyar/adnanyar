<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Adnan Yar — systems notebook</title>
  <desc id="desc">A terminal boots a notebook: it mounts research, intelligence, software, automation and products, links them into systems, then resolves into the name Adnan Yar — software engineer, systems architect, builder. Status: building.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .dim{fill:#5B6573}
    .txt{fill:#C9D1D9}
    .hi{fill:#E6EDF3}
    .cy{fill:#00D1FF}
    .vi{fill:#A97CF8}
    .au{fill:#E3B341}
    .ln{animation:show .01s linear both}
    .nm{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .cur{animation:blink 1.1s steps(1,end) infinite}
    @keyframes show{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.ln,.nm,.cur{animation:none}}
  </style>

  <rect x="1" y="1" width="878" height="398" rx="14" fill="#0B0D10" stroke="#1E242C" stroke-width="2"/>

  <!-- header strip -->
  <text class="m cy" x="28" y="29" font-size="13" font-weight="700" letter-spacing="2">AY/LAB</text>
  <text class="m dim" x="96" y="29" font-size="13">— systems notebook</text>
  <text class="m dim" x="852" y="29" font-size="13" text-anchor="end">session 0x4159 · tty/01</text>
  <line x1="1" y1="44" x2="879" y2="44" stroke="#1E242C" stroke-width="1.5"/>

  <!-- boot log -->
  <g class="m" font-size="16">
    <text class="ln" style="animation-delay:.2s" x="28" y="84"><tspan class="cy">$</tspan><tspan class="txt"> boot --notebook adnan.yar</tspan></text>

    <text class="ln dim" style="animation-delay:.6s"  x="28" y="112">  mount  <tspan class="txt">research/</tspan></text>
    <text class="ln cy"  style="animation-delay:.85s" x="400" y="112" text-anchor="end">ok</text>

    <text class="ln dim" style="animation-delay:.95s" x="28" y="138">  mount  <tspan class="txt">intelligence/</tspan></text>
    <text class="ln vi"  style="animation-delay:1.2s" x="400" y="138" text-anchor="end">ok</text>

    <text class="ln dim" style="animation-delay:1.3s" x="28" y="164">  mount  <tspan class="txt">software/</tspan></text>
    <text class="ln cy"  style="animation-delay:1.5s" x="400" y="164" text-anchor="end">ok</text>

    <text class="ln dim" style="animation-delay:1.6s" x="28" y="190">  mount  <tspan class="txt">automation/</tspan></text>
    <text class="ln cy"  style="animation-delay:1.8s" x="400" y="190" text-anchor="end">ok</text>

    <text class="ln dim" style="animation-delay:1.9s" x="28" y="216">  mount  <tspan class="txt">products/</tspan></text>
    <text class="ln cy"  style="animation-delay:2.1s" x="400" y="216" text-anchor="end">ok</text>

    <text class="ln dim" style="animation-delay:2.3s" x="28" y="242">  link   <tspan class="txt">*/ → systems/</tspan></text>
    <text class="ln cy"  style="animation-delay:2.6s" x="400" y="242" text-anchor="end">ok</text>
  </g>

  <!-- field card -->
  <g class="m" font-size="14">
    <line class="ln" style="animation-delay:.9s" x1="470" y1="70" x2="470" y2="250" stroke="#1E242C" stroke-width="1.5"/>
    <text class="ln" style="animation-delay:1.0s" x="492" y="100"><tspan class="dim">FIELD   </tspan><tspan class="txt">software engineering</tspan></text>
    <text class="ln" style="animation-delay:1.4s" x="492" y="134"><tspan class="dim">FOCUS   </tspan><tspan class="txt">architecture · AI · automation</tspan></text>
    <text class="ln" style="animation-delay:1.8s" x="492" y="168"><tspan class="dim">MODE    </tspan><tspan class="txt">research → build → ship</tspan></text>
    <text class="ln" style="animation-delay:2.2s" x="492" y="202"><tspan class="dim">RECORD  </tspan><tspan class="au">◆ gold medal, software eng.</tspan></text>
    <text class="ln" style="animation-delay:2.6s" x="492" y="236"><tspan class="dim">OUTPUT  </tspan><tspan class="txt">systems that run</tspan></text>
  </g>

  <line class="ln" style="animation-delay:2.8s" x1="28" y1="274" x2="852" y2="274" stroke="#1E242C" stroke-width="1.5"/>

  <!-- identity -->
  <text class="m hi nm" style="animation-delay:3.0s" x="26" y="336" font-size="52" font-weight="700" letter-spacing="4">ADNAN YAR</text>
  <text class="m ln" style="animation-delay:3.5s" x="28" y="372" font-size="16"><tspan class="dim">software engineer · systems architect · builder </tspan><tspan class="cy cur">▍</tspan></text>

  <!-- status -->
  <g class="ln" style="animation-delay:3.8s">
    <text class="m dim" x="712" y="322" font-size="12" letter-spacing="2">STATUS</text>
    <circle cx="718" cy="346" r="5" fill="#00D1FF"/>
    <circle cx="718" cy="346" r="5" fill="none" stroke="#00D1FF" stroke-width="1.5">
      <animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="m cy" x="734" y="352" font-size="18" font-weight="700" letter-spacing="3">BUILDING</text>
  </g>
</svg>
