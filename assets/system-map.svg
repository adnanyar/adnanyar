<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="title desc">
  <title id="title">System map — how the work flows</title>
  <desc id="desc">Research produces questions. Questions pass through an intelligence layer of LLMs and AI workflows. That layer feeds three build tracks: software (full-stack and architecture), automation (workflows and pipelines) and products (SaaS and ventures). All three converge into systems that are shipped and running. A feedback loop returns from systems to research: what ships decides what gets researched next.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .lbl{fill:#E6EDF3;font-size:15px;font-weight:700;letter-spacing:2px}
    .sub{fill:#6E7681;font-size:12px}
    .dim{fill:#5B6573}
    .cy{fill:#00D1FF}
    .vi{fill:#A97CF8}
    .node{fill:#11151A;stroke:#2A323C;stroke-width:1.5}
    .edge{fill:none;stroke:#2F3842;stroke-width:1.5}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A4450"/>
    </marker>
    <path id="p-ri" d="M440 142 V188"/>
    <path id="p-is" d="M440 252 V290 H235 V308"/>
    <path id="p-ia" d="M440 252 V308"/>
    <path id="p-ip" d="M440 252 V290 H645 V308"/>
    <path id="p-ss" d="M235 372 V410 H440 V438"/>
    <path id="p-as" d="M440 372 V438"/>
    <path id="p-ps" d="M645 372 V410 H440 V438"/>
    <path id="p-loop" d="M590 470 H800 V110 H540"/>
  </defs>

  <rect x="1" y="1" width="878" height="558" rx="14" fill="#0B0D10" stroke="#1E242C" stroke-width="2"/>

  <!-- header strip -->
  <text class="m cy" x="28" y="29" font-size="13" font-weight="700" letter-spacing="2">FIG. 01</text>
  <text class="m dim" x="100" y="29" font-size="13">— system map</text>
  <text class="m dim" x="852" y="29" font-size="13" text-anchor="end">how the work flows</text>
  <line x1="1" y1="44" x2="879" y2="44" stroke="#1E242C" stroke-width="1.5"/>

  <!-- margin: phases -->
  <g class="m dim" font-size="12" letter-spacing="1.5">
    <text x="30" y="114">01 ASK</text>
    <text x="30" y="224">02 REASON</text>
    <text x="30" y="344">03 BUILD</text>
    <text x="30" y="474">04 RUN</text>
  </g>

  <!-- edges -->
  <use href="#p-ri" class="edge" marker-end="url(#arrow)"/>
  <use href="#p-is" class="edge" marker-end="url(#arrow)"/>
  <use href="#p-ia" class="edge" marker-end="url(#arrow)"/>
  <use href="#p-ip" class="edge" marker-end="url(#arrow)"/>
  <use href="#p-ss" class="edge" marker-end="url(#arrow)"/>
  <use href="#p-as" class="edge" marker-end="url(#arrow)"/>
  <use href="#p-ps" class="edge" marker-end="url(#arrow)"/>
  <use href="#p-loop" fill="none" stroke="#3B2F57" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arrow)"/>

  <!-- feedback label -->
  <text class="m vi" font-size="11" letter-spacing="1.5" transform="translate(826 290) rotate(90)" text-anchor="middle" opacity=".8">FEEDBACK · WHAT SHIPS DECIDES WHAT GETS RESEARCHED</text>

  <!-- nodes -->
  <g class="m" text-anchor="middle">
    <rect class="node" x="340" y="78" width="200" height="64" rx="8"/>
    <text class="lbl" x="440" y="106">RESEARCH</text>
    <text class="sub" x="440" y="126">open questions</text>

    <rect x="330" y="188" width="220" height="64" rx="8" fill="#14111C" stroke="#A97CF8" stroke-opacity=".55" stroke-width="1.5"/>
    <text class="lbl" x="440" y="216">INTELLIGENCE</text>
    <text class="sub" x="440" y="236">LLMs · AI workflows</text>

    <rect class="node" x="140" y="308" width="190" height="64" rx="8"/>
    <text class="lbl" x="235" y="336">SOFTWARE</text>
    <text class="sub" x="235" y="356">full-stack · architecture</text>

    <rect class="node" x="345" y="308" width="190" height="64" rx="8"/>
    <text class="lbl" x="440" y="336">AUTOMATION</text>
    <text class="sub" x="440" y="356">workflows · pipelines</text>

    <rect class="node" x="550" y="308" width="190" height="64" rx="8"/>
    <text class="lbl" x="645" y="336">PRODUCTS</text>
    <text class="sub" x="645" y="356">SaaS · ventures</text>

    <rect x="290" y="438" width="300" height="64" rx="8" fill="#0C1A1F" stroke="#00D1FF" stroke-opacity=".7" stroke-width="1.5"/>
    <text class="lbl" x="440" y="466" style="fill:#00D1FF">SYSTEMS</text>
    <text class="sub" x="440" y="486">shipped · scaling · in production</text>
  </g>

  <!-- signal pulses -->
  <g fill="#00D1FF">
    <circle r="3.5"><animateMotion dur="1.2s" repeatCount="indefinite" begin="0s"><mpath href="#p-ri"/></animateMotion></circle>
    <circle r="3.5" fill="#A97CF8"><animateMotion dur="2.4s" repeatCount="indefinite" begin=".4s"><mpath href="#p-is"/></animateMotion></circle>
    <circle r="3.5" fill="#A97CF8"><animateMotion dur="1.6s" repeatCount="indefinite" begin=".8s"><mpath href="#p-ia"/></animateMotion></circle>
    <circle r="3.5" fill="#A97CF8"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#p-ip"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#p-ss"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="1.6s" repeatCount="indefinite" begin="2s"><mpath href="#p-as"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="2.4s"><mpath href="#p-ps"/></animateMotion></circle>
    <circle r="3" fill="#A97CF8" opacity=".85"><animateMotion dur="7s" repeatCount="indefinite" begin="1s"><mpath href="#p-loop"/></animateMotion></circle>
  </g>
</svg>
